<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Cash App Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            width: 300px;
            height: 180px;
            background-color: #00B74A;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            color: white;
            padding: 20px;
            position: relative;
        }
        .card h1 {
            font-size: 24px;
            margin: 0;
        }
        .card p {
            font-size: 16px;
            margin: 5px 0;
        }
        .card a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cash App</h1>
        <p>Card Number: **** **** **** 1234</p>
        <p>Expiry Date: 12/25</p>
        <p><a href="https://cash.app/help" target="_blank">Help Center</a></p>
        <p><a href="https://cash.app/contact" target="_blank">Contact Support</a></p>
    </div>
</body>
</html>
